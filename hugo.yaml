#baseURL: https://piperift.com/InventoryExtension/
locale: en-us
title: Inventory Extension
theme: hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs/
      weight: 1
    - name: Roadmap
      url: "https://code.piperift.com/Piperift/InventoryExtension/projects/3"
      weight: 2
    - name: Requests & Reports
      url: "https://code.piperift.com/Piperift/InventoryExtension/issues"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: FAB
      weight: 5
      url: "https://www.fab.com/listings/72840275-7621-4fb5-82cc-97ab7e0a38aa"
      params:
        icon: fab

params:
  fab: https://www.fab.com/listings/72840275-7621-4fb5-82cc-97ab7e0a38aa

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/Piperift/InventoryExtension/edit/main/content"

  imageZoom:
    enable: true
